services:
  - type: web
    name: nexoaula-2027
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /cortes
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NEXO_SECRET_KEY
        generateValue: true
      - key: NEXO_LLAVE_MAESTRA
        value: NEXO-RECTORIA-2027
